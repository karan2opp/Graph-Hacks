services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: court-memory-falkordb
    restart: unless-stopped
    ports:
      - "6379:6379" # Redis protocol (the server connects here)
      - "3000:3000" # FalkorDB Browser UI
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    environment:
      # Persist the graph to disk, snapshot every 60s if >=1 key changed.
      - FALKORDB_ARGS=--save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  falkordb_data:
